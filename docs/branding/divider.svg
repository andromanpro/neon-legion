<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="72" viewBox="0 0 1500 72" role="img" aria-labelledby="dividerTitle dividerDesc">
  <title id="dividerTitle">neon-legion section divider</title>
  <desc id="dividerDesc">Thin README divider showing the neon-legion command flow: command, plan, build, review, track.</desc>
  <defs>
    <style><![CDATA[
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;font-weight:800;letter-spacing:0;fill:#CFFAFE}
      .tiny{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:0;fill:#64FFDA}
    ]]></style>
    <linearGradient id="rail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#020617" stop-opacity="0"/>
      <stop offset=".14" stop-color="#00D4FF" stop-opacity=".60"/>
      <stop offset=".50" stop-color="#64FFDA" stop-opacity=".88"/>
      <stop offset=".86" stop-color="#FF2EC4" stop-opacity=".60"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
