<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="72" viewBox="0 0 1500 72" role="img" aria-labelledby="dividerTitle dividerDesc">
  <title id="dividerTitle">neon-legion divider</title>
  <desc id="dividerDesc">Thin neon-legion README divider showing a local agent pipeline from command to review to tracker.</desc>
  <defs>
