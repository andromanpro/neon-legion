  <rect width="1500" height="72" fill="#020617"/>
  <path d="M70 36H1430" stroke="url(#rail)" stroke-width="2"/>
  <path d="M70 22H320M1180 22H1430M70 50H320M1180 50H1430" stroke="#164B63" stroke-width="1"/>

