  </g>
  <g transform="translate(744 36)">
    <rect x="-72" y="-18" width="144" height="36" rx="6" fill="#07162B" stroke="#00D4FF" stroke-opacity=".52"/>
    <text x="0" y="5" class="tiny" text-anchor="middle">BUILD</text>
  </g>
  <g transform="translate(940 36)">
    <rect x="-72" y="-18" width="144" height="36" rx="6" fill="#07162B" stroke="#00D4FF" stroke-opacity=".52"/>
