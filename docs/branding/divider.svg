    <text x="65" y="24" class="mono" text-anchor="middle">COMMAND</text>
    <circle cx="172" cy="19" r="5" fill="#00D4FF"/>
    <rect x="214" y="0" width="130" height="38" rx="7" fill="#07182A" stroke="#00D4FF" stroke-opacity=".62"/>
