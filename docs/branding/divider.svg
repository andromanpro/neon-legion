  <rect width="1500" height="72" fill="#020617" fill-opacity="0"/>
  <path d="M58 36H1442" stroke="url(#rail)" stroke-width="2"/>
  <path d="M58 28H280M1220 28H1442M58 44H280M1220 44H1442" stroke="url(#rail)" stroke-width="1" opacity=".55"/>

  <g transform="translate(352 36)">
    <rect x="-72" y="-18" width="144" height="36" rx="6" fill="#07162B" stroke="#00D4FF" stroke-opacity=".52"/>
