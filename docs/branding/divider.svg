      .tiny{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:0;fill:#9FC7E6}
    ]]></style>
    <linearGradient id="rail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#020617" stop-opacity="0"/>
      <stop offset=".13" stop-color="#00D4FF" stop-opacity=".62"/>
      <stop offset=".50" stop-color="#64FFDA" stop-opacity=".9"/>
      <stop offset=".87" stop-color="#FF2EC4" stop-opacity=".62"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
