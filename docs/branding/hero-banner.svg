<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">neon-legion README hero</title>
  <desc id="heroDesc">README hero for neon-legion: local-first AI agent command center with NL command mark, five agent nodes, metrics, privacy gate, and JSONL tracker.</desc>
  <defs>
    <style><![CDATA[
      .title{font-family:Inter,system-ui,sans-serif;font-size:54px;font-weight:900;letter-spacing:0;fill:#F8FAFC}
      .kicker{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;font-weight:800;letter-spacing:0;fill:#64FFDA}
      .subtitle{font-family:Inter,system-ui,sans-serif;font-size:24px;font-weight:750;letter-spacing:0;fill:#DBEAFE}
      .body{font-family:Inter,system-ui,sans-serif;font-size:18px;font-weight:600;letter-spacing:0;fill:#9EC9E8}
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-weight:800;letter-spacing:0;fill:#CFFAFE}
      .small{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:0;fill:#93B7D7}
      .metric{font-family:Inter,system-ui,sans-serif;font-size:35px;font-weight:900;letter-spacing:0;fill:#64FFDA}
      .mark{fill:none;stroke:#F8FAFC;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
      .panel{fill:#06111F;stroke:#164B63;stroke-width:1.4}
      .chip{fill:#07182A;stroke:#00D4FF;stroke-width:1.4;stroke-opacity:.70}
      .wire{fill:none;stroke:#00D4FF;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#64FFDA;stroke-width:1.7;stroke-dasharray:8 10;stroke-linecap:round}
    ]]></style>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".48" stop-color="#06172A"/>
      <stop offset="1" stop-color="#171026"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="22%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00D4FF" stop-opacity=".22"/>
      <stop offset=".65" stop-color="#00D4FF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="76%" cy="40%" r="56%">
      <stop offset="0" stop-color="#64FFDA" stop-opacity=".18"/>
      <stop offset=".58" stop-color="#7C3AED" stop-opacity=".10"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#F8FAFC" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#00D4FF"/>
    </marker>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#cyanGlow)"/>
  <rect width="1500" height="500" fill="url(#greenGlow)"/>
  <rect width="1500" height="500" fill="url(#scan)" opacity=".8"/>

  <g opacity=".23">
    <path d="M0 410H1500M0 440H1500M0 470H1500" stroke="#00D4FF"/>
    <path d="M110 500L550 368M310 500L665 368M510 500L780 368M710 500L895 368M910 500L1010 368M1110 500L1125 368M1310 500L1240 368" stroke="#00D4FF"/>
    <path d="M0 456H1500M0 486H1500" stroke="#FF2EC4"/>
  </g>

  <path d="M18 86V36H66M1434 36H1482V86" fill="none" stroke="#00D4FF" stroke-width="3"/>
  <path d="M18 414V464H66M1434 464H1482V414" fill="none" stroke="#FF2EC4" stroke-width="3"/>

  <g transform="translate(62 52)">
    <rect class="panel" x="0" y="0" width="615" height="384" rx="16"/>
    <path class="wire" d="M28 34H188L208 18H382" opacity=".68"/>

    <g transform="translate(46 88) scale(.88)">
      <circle cx="96" cy="96" r="88" fill="#06111F" stroke="#00D4FF" stroke-width="3" stroke-opacity=".72"/>
      <circle cx="96" cy="96" r="62" fill="none" stroke="#64FFDA" stroke-width="1.5" stroke-opacity=".34"/>
      <path d="M30 96H162M96 30V172" stroke="#7DD3FC" stroke-width="1.3" stroke-opacity=".26"/>
      <path class="mark" d="M42 135V57L108 135V57" filter="url(#glow)"/>
      <path class="mark" d="M140 57V135H180" filter="url(#glow)"/>
      <circle cx="28" cy="96" r="9" fill="#00D4FF"/>
      <circle cx="164" cy="96" r="9" fill="#00D4FF"/>
      <circle cx="96" cy="28" r="8" fill="#64FFDA"/>
      <circle cx="96" cy="164" r="8" fill="#FFB020"/>
    </g>

    <text x="242" y="124" class="title" filter="url(#glow)">NEON-LEGION</text>
    <text x="246" y="160" class="subtitle">local AI command center</text>
    <text x="246" y="200" class="body">Orchestrate Claude, Codex, OpenClaw,</text>
    <text x="246" y="226" class="body">OpenCode, and DeepSeek.</text>

    <g transform="translate(56 278)">
      <rect class="chip" x="0" y="0" width="124" height="38" rx="7"/>
      <text x="20" y="24" class="mono">CLAUDE</text>
      <rect class="chip" x="140" y="0" width="114" height="38" rx="7"/>
      <text x="160" y="24" class="mono">CODEX</text>
      <rect class="chip" x="270" y="0" width="138" height="38" rx="7"/>
      <text x="290" y="24" class="mono">OPENCLAW</text>
      <rect class="chip" x="424" y="0" width="124" height="38" rx="7"/>
      <text x="443" y="24" class="mono">OPENCODE</text>
    </g>

    <g transform="translate(56 330)">
      <text x="0" y="20" class="small">LOCAL-FIRST</text>
      <text x="152" y="20" class="small">JSONL LEDGER</text>
      <text x="318" y="20" class="small">HUMAN APPROVAL GATE</text>
    </g>
  </g>

  <g transform="translate(710 52)">
    <rect class="panel" x="0" y="0" width="728" height="384" rx="16"/>
    <text x="30" y="34" class="kicker">MISSION CONTROL / PUBLIC-SAFE SNAPSHOT</text>

    <g transform="translate(30 64)">
      <rect class="chip" x="0" y="0" width="208" height="84" rx="9"/>
      <text x="18" y="28" class="small">NET SAVINGS</text>
      <text x="18" y="65" class="metric">$73K</text>
      <rect class="chip" x="238" y="0" width="208" height="84" rx="9"/>
      <text x="256" y="28" class="small">PRODUCTIVITY</text>
      <text x="256" y="65" class="metric">x9.8</text>
      <rect class="chip" x="476" y="0" width="208" height="84" rx="9"/>
      <text x="494" y="28" class="small">SESSIONS RATED</text>
      <text x="494" y="65" class="metric">245/247</text>
    </g>

    <g transform="translate(32 194)">
      <path class="wire" marker-end="url(#arrow)" d="M104 30H164"/>
      <path class="wire" marker-end="url(#arrow)" d="M282 30H344"/>
      <path class="wire" marker-end="url(#arrow)" d="M462 30H524"/>
      <path class="dash" d="M406 70C450 112 520 112 562 70"/>
      <rect class="chip" x="0" y="0" width="104" height="60" rx="9"/>
      <text x="52" y="25" class="small" text-anchor="middle">Telegram</text>
      <text x="52" y="43" class="small" text-anchor="middle">command</text>
      <rect class="chip" x="164" y="0" width="118" height="60" rx="9"/>
      <text x="223" y="25" class="small" text-anchor="middle">OpenClaw</text>
      <text x="223" y="43" class="small" text-anchor="middle">bridge</text>
      <rect class="chip" x="344" y="0" width="118" height="60" rx="9"/>
      <text x="403" y="25" class="small" text-anchor="middle">Claude</text>
      <text x="403" y="43" class="small" text-anchor="middle">architect</text>
      <rect class="chip" x="524" y="0" width="118" height="60" rx="9"/>
      <text x="583" y="25" class="small" text-anchor="middle">Codex</text>
      <text x="583" y="43" class="small" text-anchor="middle">developer</text>
      <rect class="chip" x="344" y="86" width="118" height="48" rx="9" stroke="#FF2EC4" stroke-opacity=".70"/>
      <text x="403" y="107" class="small" text-anchor="middle">DeepSeek</text>
      <text x="403" y="124" class="small" text-anchor="middle">reviewer</text>
      <rect class="chip" x="524" y="86" width="118" height="48" rx="9" stroke="#FFB020" stroke-opacity=".80"/>
      <text x="583" y="107" class="small" text-anchor="middle">Human</text>
      <text x="583" y="124" class="small" text-anchor="middle">approve</text>
    </g>

    <g transform="translate(30 342)">
      <rect x="0" y="0" width="668" height="30" rx="8" fill="#07182A" stroke="#64FFDA" stroke-opacity=".42"/>
      <text x="22" y="20" class="mono">EVENTS -> JSONL -> DASHBOARD</text>
      <text x="350" y="20" class="mono">NO SAAS / NO TELEMETRY</text>
    </g>
  </g>
</svg>
