<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="socialTitle socialDesc">
  <title id="socialTitle">neon-legion social card</title>
  <desc id="socialDesc">OpenGraph preview for neon-legion: a local-first command center for tracking and orchestrating AI agents.</desc>
  <defs>
    <style><![CDATA[
      .title{font-family:Inter,system-ui,sans-serif;font-size:78px;font-weight:900;letter-spacing:0;fill:#F8FAFC}
      .subtitle{font-family:Inter,system-ui,sans-serif;font-size:30px;font-weight:780;letter-spacing:0;fill:#DBEAFE}
      .body{font-family:Inter,system-ui,sans-serif;font-size:21px;font-weight:650;letter-spacing:0;fill:#9EC9E8}
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:15px;font-weight:800;letter-spacing:0;fill:#CFFAFE}
      .small{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:0;fill:#93B7D7}
      .metric{font-family:Inter,system-ui,sans-serif;font-size:42px;font-weight:900;letter-spacing:0;fill:#64FFDA}
      .metricSmall{font-size:32px}
      .mark{fill:none;stroke:#F8FAFC;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
      .chip{fill:#07182A;stroke:#00D4FF;stroke-width:1.5;stroke-opacity:.72}
      .wire{fill:none;stroke:#00D4FF;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    ]]></style>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".50" stop-color="#06172A"/>
      <stop offset="1" stop-color="#1A1027"/>
    </linearGradient>
    <radialGradient id="markGlow" cx="25%" cy="42%" r="55%">
      <stop offset="0" stop-color="#00D4FF" stop-opacity=".25"/>
      <stop offset=".60" stop-color="#00D4FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="80%" cy="40%" r="58%">
      <stop offset="0" stop-color="#64FFDA" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#7C3AED" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#F8FAFC" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#00D4FF"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#markGlow)"/>
  <rect width="1200" height="630" fill="url(#cardGlow)"/>
  <rect width="1200" height="630" fill="url(#scan)" opacity=".80"/>
  <path d="M36 114V36H116M1084 36H1164V114M36 516V594H116M1084 594H1164V516" fill="none" stroke="#00D4FF" stroke-width="3"/>
  <path d="M1084 36H1164V114M36 516V594H116" fill="none" stroke="#FF2EC4" stroke-width="3"/>

  <g transform="translate(78 112)">
    <circle cx="132" cy="150" r="126" fill="#06111F" fill-opacity=".60" stroke="#00D4FF" stroke-width="4" stroke-opacity=".74"/>
    <circle cx="132" cy="150" r="88" fill="none" stroke="#64FFDA" stroke-width="2" stroke-opacity=".32"/>
    <path d="M40 150H224M132 58V242" stroke="#7DD3FC" stroke-width="1.5" stroke-opacity=".26"/>
    <path class="mark" d="M58 206V94L154 206V94" filter="url(#glow)"/>
    <path class="mark" d="M202 94V206H260" filter="url(#glow)"/>
    <circle cx="36" cy="150" r="11" fill="#00D4FF"/>
    <circle cx="228" cy="150" r="11" fill="#00D4FF"/>
    <circle cx="132" cy="54" r="10" fill="#64FFDA"/>
    <circle cx="132" cy="246" r="10" fill="#FFB020"/>
  </g>

  <text x="390" y="178" class="title" filter="url(#glow)">NEON-LEGION</text>
  <text x="394" y="224" class="subtitle">your local AI agent command center</text>
  <text x="394" y="268" class="body">Orchestrate Claude, Codex, OpenClaw, OpenCode, and DeepSeek.</text>
  <text x="394" y="300" class="body">Track cost, saved hours, stress, approvals, and public-safe snapshots.</text>

  <g transform="translate(394 346)">
    <rect class="chip" x="0" y="0" width="158" height="72" rx="10"/>
    <text x="18" y="25" class="small">NET SAVINGS</text>
    <text x="18" y="58" class="metric">$73K</text>
    <rect class="chip" x="176" y="0" width="150" height="72" rx="10"/>
    <text x="194" y="25" class="small">MULTIPLIER</text>
    <text x="194" y="58" class="metric">x9.8</text>
    <rect class="chip" x="344" y="0" width="270" height="72" rx="10"/>
    <text x="362" y="25" class="small">PRIVACY</text>
    <text x="362" y="58" class="metric metricSmall">PUBLIC-SAFE</text>
  </g>

  <g transform="translate(394 462)">
    <path class="wire" marker-end="url(#arrow)" d="M102 28H146"/>
    <path class="wire" marker-end="url(#arrow)" d="M246 28H290"/>
    <path class="wire" marker-end="url(#arrow)" d="M390 28H434"/>
    <path class="wire" marker-end="url(#arrow)" d="M534 28H578"/>
    <rect class="chip" x="0" y="0" width="102" height="56" rx="8"/>
    <text x="51" y="34" class="small" text-anchor="middle">command</text>
    <rect class="chip" x="146" y="0" width="100" height="56" rx="8"/>
    <text x="196" y="34" class="small" text-anchor="middle">plan</text>
    <rect class="chip" x="290" y="0" width="100" height="56" rx="8"/>
    <text x="340" y="34" class="small" text-anchor="middle">build</text>
    <rect class="chip" x="434" y="0" width="100" height="56" rx="8"/>
    <text x="484" y="34" class="small" text-anchor="middle">review</text>
    <rect class="chip" x="578" y="0" width="124" height="56" rx="8" stroke="#64FFDA" stroke-opacity=".78"/>
    <text x="640" y="34" class="small" text-anchor="middle">track</text>
  </g>

  <text x="78" y="560" class="mono">LOCAL-FIRST / JSONL LEDGER / NO SAAS TELEMETRY</text>
</svg>
