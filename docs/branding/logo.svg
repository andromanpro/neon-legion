<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">neon-legion command mark</title>
  <desc id="logoDesc">A compact neon-legion command mark: angular NL monogram, five agent nodes, local ledger rails, and human approval accent.</desc>
  <defs>
    <style><![CDATA[
      .mark{fill:none;stroke:#F8FAFC;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
      .rail{fill:none;stroke:#7DD3FC;stroke-width:2;stroke-opacity:.35}
      .node{stroke:#020617;stroke-width:8}
      .label{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:16px;font-weight:800;letter-spacing:0;fill:#CFFAFE}
    ]]></style>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06111F"/>
      <stop offset=".52" stop-color="#071B2B"/>
      <stop offset="1" stop-color="#1A1027"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#22D3EE" stop-opacity=".10"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <rect width="512" height="512" rx="72" fill="url(#aura)"/>

  <path d="M48 118V48H126" fill="none" stroke="#00D4FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M386 48H464V118" fill="none" stroke="#FF2EC4" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 394V464H126" fill="none" stroke="#FFB020" stroke-width="5" stroke-linecap="round"/>
  <path d="M386 464H464V394" fill="none" stroke="#64FFDA" stroke-width="5" stroke-linecap="round"/>

  <circle cx="256" cy="242" r="156" fill="#06111F" fill-opacity=".48" stroke="#00D4FF" stroke-width="4" stroke-opacity=".72"/>
  <circle cx="256" cy="242" r="118" fill="none" stroke="#64FFDA" stroke-width="2" stroke-opacity=".28"/>
  <path class="rail" d="M106 382H406M132 414H380M164 444H348"/>
  <path class="rail" d="M256 84V400M116 242H396"/>

  <g filter="url(#softGlow)">
    <path class="mark" d="M140 324V174L276 324V174"/>
    <path class="mark" d="M342 174V324H426"/>
  </g>

  <circle class="node" cx="116" cy="242" r="16" fill="#00D4FF"/>
  <circle class="node" cx="190" cy="118" r="13" fill="#64FFDA"/>
  <circle class="node" cx="322" cy="118" r="13" fill="#64FFDA"/>
  <circle class="node" cx="396" cy="242" r="16" fill="#00D4FF"/>
  <circle class="node" cx="256" cy="386" r="15" fill="#FFB020"/>

  <text x="256" y="425" class="label" text-anchor="middle">LOCAL AI OPS</text>
</svg>
