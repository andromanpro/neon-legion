<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle logoDesc">
  <desc id="logoDesc">Square neon-legion logo with a cyberpunk shield, NL monogram, radar reticle, and five agent blips.</desc>
  <title id="logoTitle">neon-legion logo</title>
  <defs>
    <style><![CDATA[
      .mark{font-family:Inter,system-ui,sans-serif;font-size:168px;font-weight:900;letter-spacing:0;fill:#F8FAFC}
      .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:28px;font-weight:800;fill:#64FFDA}
      .cyan{stroke:#00D4FF}.mag{stroke:#FF2EC4}.green{stroke:#64FFDA}.thin{fill:none;stroke-width:3}.hair{fill:none;stroke-width:1.5}
    ]]></style>
    <linearGradient id="logoBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.58" stop-color="#071a32"/>
      <stop offset="1" stop-color="#24072f"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="56" fill="url(#logoBg)"/>
  <rect width="512" height="512" rx="56" fill="url(#pulse)"/>
  <g opacity="0.42" class="hair">
    <path d="M64 392H448M86 424H426M110 456H402" class="cyan"/>
    <path d="M120 512L214 334M256 512V334M392 512L298 334" class="mag"/>
  </g>
  <g transform="translate(256 254)" filter="url(#glow)">
    <circle r="160" fill="none" stroke="#00D4FF" stroke-width="3" stroke-opacity="0.55"/>
    <circle r="108" fill="none" stroke="#64FFDA" stroke-width="2" stroke-opacity="0.38"/>
    <path d="M0 -178V-122M0 122V178M-178 0H-122M122 0H178" class="cyan thin" opacity="0.72"/>
    <g fill="#00D4FF"><circle cx="-96" cy="-60" r="8"/><circle cx="86" cy="-78" r="8"/><circle cx="104" cy="42" r="8"/><circle cx="-54" cy="96" r="8"/><circle cx="20" cy="-12" r="8"/></g>
  </g>
  <g filter="url(#glow)">
    <path d="M256 46L396 106V276C396 360 329 421 256 466C183 421 116 360 116 276V106Z" fill="#020617" fill-opacity="0.76" stroke="#00D4FF" stroke-width="7"/>
    <path d="M256 95L346 134V269C346 320 306 362 256 395C206 362 166 320 166 269V134Z" fill="none" stroke="#FF2EC4" stroke-width="4"/>
    <text x="256" y="310" class="mark" text-anchor="middle">NL</text>
    <text x="256" y="361" class="mono" text-anchor="middle">LEGION</text>
  </g>
  <g opacity="0.8" class="thin">
    <path d="M38 38H114M38 38V114" class="cyan"/>
    <path d="M474 38H398M474 38V114" class="mag"/>
    <path d="M38 474H114M38 474V398" class="mag"/>
    <path d="M474 474H398M474 474V398" class="cyan"/>
  </g>
</svg>
