name: Tests and public-source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete isolated test suite
        run: python -m pytest -q
      - name: Check public source for configured identifier patterns
        run: python tools/oss-sanitize.py --check

# Fixtures and mocked CLI boundaries only; no AI CLI credentials, live tracker
# files, or paid model calls. Generic sanitizer rules are not a full secret scan.
