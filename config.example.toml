# neon-legion configuration template
#
# This file is the canonical default config. Override locally by creating
# `config.toml` (gitignored) next to this file with only the keys you want
# to change. Env vars (e.g. NEON_LEGION_PORT) still work and take precedence
# over both files — see `tools/config.py:ENV_OVERRIDES` for the mapping.
#
# Precedence (highest first): CLI flag → env var → config.toml → config.example.toml → code default.

[paths]
# Where the snapshot writer atomically lands the WP-page JSON.
# Default: <project>/dashboard/snapshot.json (local) — change to your WP
# uploads directory if you want the dashboard live on a WordPress host.
snapshot_output = "dashboard/snapshot.json"

# Salt for hashing session_id in --public mode. 32 random bytes, auto-generated
# on first --public run. KEEP THIS PATH OUT OF YOUR REPO.
salt_file = "~/.multi-agent-snapshot-salt"

# Optional: file listing customer / project names to scrub from public
# snapshots. One name per line; "#" lines are comments. Russian inflections
# need to be listed explicitly — the regex matches whole-word case-insensitive.
customers_blocklist = ""

[backend]
# Backend API listens here. Keep 127.0.0.1 unless you intentionally want LAN
# access — even then prefer a reverse proxy with auth.
host = "127.0.0.1"
port = 8089

# Snapshot writer cadence
snapshot_interval_seconds = 900
snapshot_period_days = 62

[oracle]
# AI used for productivity estimation ("how long would this have taken without
# AI?"). Currently "codex" (via Codex CLI) or "claude" (when headless OAuth is
# fixed). DeepSeek/GPT/Gemini via OpenRouter also work — see tools/oracle-*.py.
provider = "codex"

# Sandbox mode for the oracle subprocess. read-only is safest.
sandbox = "read-only"

[providers.anthropic]
# Monthly subscription cost in USD. Used for "subscription pro-rated" savings.
# Examples: Claude Pro = 20, Claude Max 5x = 100, Claude Max 20x = 200.
subscription_usd = 200.0

[providers.openai]
# ChatGPT Plus = 20, ChatGPT Pro = 200, API-only = 0.
subscription_usd = 200.0

[providers.openrouter]
# Pay-as-you-go. Leave 0 unless you want to amortize a fixed credit topup.
subscription_usd = 0.0

[dashboard]
# Currency conversion target for non-USD rendering. Set to empty string to
# disable conversion. Conversion rate fetched daily from cbr-xml-daily.ru (RU
# central bank) — replace endpoint if you need a different source.
display_currency = "RUB"

[cost_regression]
threshold = 1.2          # 7d/30d cost-per-output-token ratio
min_calls = 10           # skip pairs with fewer output tokens in 7d window
short_days = 7
long_days = 30
output_path = "F:/WorkAI/multi-agent/tracker/regressions.json"

[hooks]
# Where Claude Code stores per-project state. Default works for stock Claude
# Code; override if you've moved ~/.claude.
claude_projects_dir = "~/.claude/projects"
