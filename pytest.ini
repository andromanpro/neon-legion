[pytest]
# A bare "pytest" from the repo root collects tests/ only. Walking the whole
# tree is fragile: sandboxed agent runs have left mkdtemp directories behind
# whose ACL admits only their owner, and a single unreadable directory aborts
# collection with PermissionError (459 of them, tracker/ and pytestdir/).
testpaths = tests
# For explicit paths such as "pytest .": skip runtime data and tempfile-named
# leftovers. Setting norecursedirs replaces pytest's defaults, so the first
# nine patterns repeat them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} tracker tmp*
